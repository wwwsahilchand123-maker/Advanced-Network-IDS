rule_id: "DNS_001"
name: "Excessive DNS Query Rate"
description: "Detects unusually high DNS query rates"
category: "command_and_control"
severity: "MEDIUM"
enabled: true

mitre_attack:
  tactic: "Command and Control"
  technique: "T1071.004"
  technique_name: "DNS"

detection_logic:
  type: "threshold"
  conditions:
    - metric: "queries_per_minute"
      threshold: 50
      time_window: 60

response:
  alert: true
  block: false
  correlate: true
  cooldown: 300

---

rule_id: "DNS_002"
name: "High Entropy Domain (DGA Detection)"
description: "Detects domains with high entropy, possibly generated by DGA"
category: "command_and_control"
severity: "HIGH"
enabled: true

mitre_attack:
  tactic: "Command and Control"
  technique: "T1568.002"
  technique_name: "Domain Generation Algorithms"

detection_logic:
  type: "entropy_analysis"
  conditions:
    - metric: "domain_entropy"
      threshold: 3.5

response:
  alert: true
  block: false
  correlate: true
  cooldown: 180
